<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Güvenli Ödeme - Eventia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-base: #f4f6f8; 
            --bg-card: #ffffff; 
            --accent: #ed1c24; 
            --text-main: #212529; 
            --text-sec: #6c757d; 
            --border-color: #e5e5e5;
        }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0; }
        .checkout-container { background-color: var(--bg-card); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .form-control, .form-select { background-color: #f8f9fa; border: 1px solid var(--border-color); color: var(--text-main); }
        .form-control:focus, .form-select:focus { background-color: #ffffff; border-color: var(--accent); box-shadow: 0 0 0 0.25rem rgba(237, 28, 36, 0.15); }
        .btn-pay { background-color: #198754; color: #ffffff; font-weight: 700; padding: 1rem; border-radius: 8px; border: none; transition: 0.3s; width: 100%; font-size: 1.1rem; margin-top: 1rem; }
        .btn-pay:hover { background-color: #157347; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2); color: white;}
        .credit-card { background: linear-gradient(135deg, #1d2b64 0%, #f80759 100%); height: 210px; border-radius: 16px; padding: 24px; position: relative; margin-bottom: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: transform 0.3s; color: white;}
        .credit-card:hover { transform: translateY(-5px); }
        .cc-chip { width: 45px; height: 34px; background: linear-gradient(135deg, #e5b13a, #f7d070); border-radius: 6px; margin-bottom: 24px; }
        .cc-number { font-family: 'Courier New', monospace; font-size: 1.3rem; letter-spacing: 4px; margin-bottom: 24px; color: #fff; }
        .cc-bottom { display: flex; justify-content: space-between; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .cc-bottom span { display: block; font-size: 0.65rem; opacity: 0.8; margin-bottom: 3px; }
        label { color: var(--text-sec); font-size: 0.85rem; font-weight: 500; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="checkout-container">

        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="fw-bold mb-0 text-dark">Güvenli Ödeme</h4>
            <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i>İptal</a>
        </div>
        <p class="text-secondary small mb-4">
            <strong class="text-dark" th:text="${event.title}">Etkinlik Adı</strong> için ödeme yapıyorsunuz.
        </p>

        <div class="credit-card">
            <div class="cc-chip"></div>
            <div class="cc-number" id="display-number">#### #### #### ####</div>
            <div class="cc-bottom">
                <div>
                    <span>Kart Sahibi</span>
                    <div id="display-name" class="fw-bold">AD SOYAD</div>
                </div>
                <div class="text-end">
                    <span>SKT</span>
                    <div id="display-date" class="fw-bold">AA/YY</div>
                </div>
            </div>
        </div>

        <form th:action="@{/payments/pay}" method="POST">
            
            <div th:if="${param.error}" class="alert alert-danger text-center border-0 shadow-sm small py-2" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i>Ödeme işlemi başarısız oldu.
            </div>

            <div class="mb-4 bg-light p-3 rounded border">
                <label class="form-label mb-1 text-dark fw-bold">Bilet Tipi Seçin</label>
                <select name="ticketTypeId" id="ticketTypeSelect" class="form-select fw-bold text-danger" required onchange="updatePrice()">
                    <option value="" data-price="0">-- Bilet Tipi Seç --</option>
                    <option th:each="type : ${ticketTypes}" 
                            th:value="${type.id}" 
                            th:data-price="${type.price}"
                            th:disabled="${type.quota <= 0}"
                            th:text="${type.quota > 0 ? type.name + ' - ' + type.price + ' TL' : type.name + ' - (TÜKENDİ)'}">
                    </option>
                </select>
                <input type="hidden" name="price" id="hiddenPrice" value="0">
            </div>

            <div class="mb-3">
                <label class="form-label mb-1">Kart Üzerindeki İsim</label>
                <input type="text" name="cardHolderName" id="input-name" class="form-control"
                       placeholder="Ad Soyad" required oninput="updateCard()">
            </div>

            <div class="mb-3">
                <label class="form-label mb-1">Kart Numarası</label>
                <input type="text" name="cardNumber" id="input-number" class="form-control"
                       placeholder="1234 5678 9012 3456" maxlength="16" required oninput="updateCard()">
            </div>

            <div class="row g-3 mb-2">
                <div class="col-4">
                    <label class="form-label mb-1">Ay</label>
                    <input type="text" name="expireMonth" id="input-month" class="form-control"
                           placeholder="AA" maxlength="2" required oninput="updateCard()">
                </div>
                <div class="col-4">
                    <label class="form-label mb-1">Yıl</label>
                    <input type="text" name="expireYear" id="input-year" class="form-control"
                           placeholder="YY" maxlength="2" required oninput="updateCard()">
                </div>
                <div class="col-4">
                    <label class="form-label mb-1">CVC</label>
                    <input type="text" name="cvc" class="form-control"
                           placeholder="123" maxlength="3" required>
                </div>
            </div>

            <button type="submit" class="btn-pay"><i class="fa-solid fa-lock me-2"></i>Ödemeyi Tamamla</button>
        </form>
    </div>
</div>

<script>
    function updateCard() {
        const name = document.getElementById('input-name').value.toUpperCase();
        document.getElementById('display-name').innerText = name || 'AD SOYAD';

        let num = document.getElementById('input-number').value.replace(/\D/g, '');
        document.getElementById('display-number').innerText =
            num.match(/.{1,4}/g)?.join(' ') || '#### #### #### ####';

        const m = document.getElementById('input-month').value || 'AA';
        const y = document.getElementById('input-year').value || 'YY';
        document.getElementById('display-date').innerText = m + '/' + y;
    }

    function updatePrice() {
        var select = document.getElementById("ticketTypeSelect");
        var price = select.options[select.selectedIndex].getAttribute("data-price");
        document.getElementById("hiddenPrice").value = price;
    }
</script>
</body>
</html>
