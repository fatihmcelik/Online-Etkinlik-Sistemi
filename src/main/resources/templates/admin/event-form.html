<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etkinlik Formu - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-base: #f4f6f8; 
            --bg-card: #ffffff; 
            --accent: #ed1c24; 
            --accent-hover: #c9141b;
            --text-main: #2b2b2b; 
            --text-sec: #6c757d;
            --border-color: #e5e5e5;
        }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Segoe UI', sans-serif; padding: 3rem 1rem; }
        
        .form-card { background-color: var(--bg-card); border-radius: 16px; padding: 3rem; max-width: 800px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        
        .form-control, .form-select { background-color: #f8f9fa; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 8px; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 0.25rem rgba(237,28,36,0.15); background-color: #fff; }
        
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        label { color: var(--text-sec); font-size: 0.85rem; font-weight: 600; }
        
        .btn-custom { background-color: var(--accent); color: white; font-weight: bold; padding: 0.85rem; border-radius: 8px; border: none; transition: 0.3s; }
        .btn-custom:hover { background-color: var(--accent-hover); color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(237, 28, 36, 0.2); }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <h3 class="fw-bold mb-0 text-dark"
                th:text="${event.id == null ? 'Yeni Etkinlik Ekle' : 'Etkinliği Düzenle'}">
                Etkinlik Formu
            </h3>
            <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary fw-bold"><i class="fa-solid fa-arrow-left me-1"></i>Vazgeç</a>
        </div>

        <form th:action="@{/admin/event/save}" method="POST" th:object="${event}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label class="form-label mb-1">Etkinlik Başlığı</label>
                <input type="text" class="form-control" th:field="*{title}" placeholder="Örn: Açık Hava Konseri" required>
            </div>

            <div class="mb-4">
                <label class="form-label mb-1">Açıklama</label>
                <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Etkinlik hakkında detaylı bilgi verin..." required></textarea>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label mb-1">Başlangıç Tarihi ve Saati</label>
                    <input type="datetime-local" class="form-control" th:field="*{startDate}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label mb-1">Bitiş Tarihi ve Saati</label>
                    <input type="datetime-local" class="form-control" th:field="*{endDate}" required>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label mb-1">Kategori</label>
                    <select class="form-select" name="category.id" required>
                        <option value="">Kategori Seçin</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${event.category != null and event.category.id == cat.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label mb-1">Mekan</label>
                    <select class="form-select" name="location.id" required>
                        <option value="">Mekan Seçin</option>
                        <option th:each="loc : ${locations}"
                                th:value="${loc.id}"
                                th:text="${loc.name + ' - ' + loc.city}"
                                th:selected="${event.location != null and event.location.id == loc.id}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label mb-1">Afiş / Görsel URL</label>
                <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="https://resim-url.com/afis.jpg">
            </div>

            <div class="form-check mb-4 bg-light p-3 rounded border">
                <input class="form-check-input ms-1" type="checkbox" id="isActive" th:field="*{active}">
                <label class="form-check-label ms-2 text-dark fw-bold" for="isActive">Bu etkinliği hemen yayına al (Sitede görünür yap)</label>
            </div>

            <button type="submit" class="btn-custom w-100 mt-2">
                <i class="fa-solid fa-floppy-disk me-2"></i> Etkinliği Kaydet
            </button>
        </form>
    </div>
</div>
</body>
</html>
