<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sistem Logları - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-base: #f4f6f8; --bg-card: #ffffff; --accent: #ed1c24; --text-main: #2b2b2b; --text-sec: #6c757d; --border-color: #e5e5e5; }
        body { background-color: var(--bg-base); font-family: 'Segoe UI', sans-serif; }
        .content { padding: 3rem; }
        .table-wrapper { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
        .table thead th { background-color: #f8f9fa; color: var(--text-sec); font-weight: 600; padding: 1rem; }
        .table tbody td { padding: 1rem; vertical-align: middle; border-bottom: 1px solid var(--border-color); font-size: 0.9rem;}
    </style>
</head>
<body>
<div class="content container">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h3 class="fw-bold m-0"><i class="fa-solid fa-shield-halved text-danger me-2"></i>Sistem Güvenlik Logları</h3>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary fw-bold"><i class="fa-solid fa-arrow-left me-2"></i>Geri Dön</a>
    </div>

    <div class="table-wrapper">
        <div class="table-responsive">
            <table class="table mb-0 table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tarih / Saat</th>
                        <th>Eylem Tipi</th>
                        <th>Etkilenen Tablo</th>
                        <th>İşlem Detayı</th>
                        <th>Yapan Kullanıcı</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td class="text-secondary" th:text="${log.id}">1</td>
                        <td class="fw-semibold" th:text="${#temporals.format(log.timestamp, 'dd.MM.yyyy HH:mm:ss')}">Tarih</td>
                        <td>
                            <span class="badge" th:classappend="${log.action.contains('FAILED') ? 'bg-danger' : (log.action.contains('SUCCESS') ? 'bg-success' : 'bg-dark')}" th:text="${log.action}">ACTION</span>
                        </td>
                        <td class="text-secondary fw-bold" th:text="${log.entityType != null ? log.entityType : '-'}">Tablo</td>
                        <td th:text="${log.details}">Detay</td>
                        <td>
                            <span class="badge bg-light text-dark border"><i class="fa-solid fa-user me-1"></i> <span th:text="${log.user != null ? log.user.username : 'Sistem'}">User</span></span>
                        </td>
                    </tr>
                    <tr th:if="${logs == null or logs.isEmpty()}">
                        <td colspan="6" class="text-center py-4 text-muted">Sistemde henüz kayıtlı işlem logu bulunmuyor.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
