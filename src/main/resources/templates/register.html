<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kayıt Ol - Eventia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-base: #f4f6f8; 
            --bg-card: #ffffff; 
            --accent: #ed1c24; 
            --accent-hover: #c9141b;
            --text-main: #212529; 
            --text-sec: #6c757d; 
            --border-color: #e5e5e5;
        }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
        
        .card-custom { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 500px; padding: 2.5rem; }
        .logo-text { color: var(--accent); font-weight: 800; font-size: 2rem; text-align: center; margin-bottom: 0.5rem; letter-spacing: -1px; }
        
        .form-control { background-color: #f8f9fa; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 8px; }
        .form-control:focus { background-color: #ffffff; color: var(--text-main); border-color: var(--accent); box-shadow: 0 0 0 0.25rem rgba(237, 28, 36, 0.15); }
        
        .btn-custom { background-color: var(--accent); color: #ffffff; font-weight: 700; border: none; padding: 0.85rem; border-radius: 8px; transition: all 0.3s ease; font-size: 1.05rem; margin-top: 1rem; }
        .btn-custom:hover { background-color: var(--accent-hover); color: #ffffff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(237, 28, 36, 0.2); }
        
        .text-secondary-custom { color: var(--text-sec) !important; font-weight: 500; }
        a { color: var(--accent); text-decoration: none; font-weight: 600; transition: color 0.3s; }
        a:hover { color: var(--accent-hover); text-decoration: underline; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="card-custom">
        <div class="logo-text">Eventia</div>
        <p class="text-center text-secondary-custom mb-4">Hemen yeni bir hesap oluştur</p>

        <div th:if="${param.error}" class="alert alert-danger text-center border-0 shadow-sm" style="background-color: #fff0f1; color: #ed1c24; border-radius: 8px;">
            <i class="fa-solid fa-circle-exclamation me-2"></i>Kayıt işlemi başarısız. Lütfen bilgileri kontrol edin.
        </div>

        <form th:action="@{/register}" method="POST" th:object="${user}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-secondary-custom small mb-1">Ad</label>
                    <input type="text" class="form-control" th:field="*{firstName}" placeholder="Adınız" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-secondary-custom small mb-1">Soyad</label>
                    <input type="text" class="form-control" th:field="*{lastName}" placeholder="Soyadınız" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary-custom small mb-1">Kullanıcı Adı</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary"><i class="fa-solid fa-at"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" th:field="*{username}" placeholder="kullaniciadi" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary-custom small mb-1">E-posta</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" th:field="*{email}" placeholder="ornek@email.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary-custom small mb-1">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" th:field="*{passwordHash}" placeholder="En az 6 karakter" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-custom w-100 mb-4">Ücretsiz Kayıt Ol</button>
            
            <div class="text-center text-secondary-custom" style="font-size: 0.95rem;">
                Zaten üye misin? <a th:href="@{/login}">Giriş Yap</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
