<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Şifre Sıfırlama - Eventia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-base: #f4f6f8; 
            --bg-card: #ffffff; 
            --accent: #ed1c24; 
            --accent-hover: #c9141b;
            --text-main: #212529; 
            --text-sec: #6c757d; 
            --border-color: #e5e5e5;
        }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card-custom { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .logo-text { color: var(--accent); font-weight: 800; font-size: 2rem; text-align: center; margin-bottom: 1rem; letter-spacing: -1px; }
        .form-control { background-color: #f8f9fa; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem 1rem; border-radius: 8px; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 0.25rem rgba(237, 28, 36, 0.15); background-color: #ffffff;}
        .btn-custom { background-color: var(--accent); color: #ffffff; font-weight: 700; padding: 0.85rem; border-radius: 8px; border: none; transition: 0.3s; font-size: 1.05rem; }
        .btn-custom:hover { background-color: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(237, 28, 36, 0.2); color: #ffffff;}
        .text-secondary-custom { color: var(--text-sec); font-weight: 500; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="card-custom">
        <div class="logo-text">Eventia</div>
        <h5 class="fw-bold text-center mb-4">Yeni Şifre Belirle</h5>
        
        <form th:action="@{/forgot-password/reset}" method="POST">
            <input type="hidden" name="token" th:value="${param.token}">
            <div class="mb-4">
                <label class="form-label text-secondary-custom small mb-1">Yeni Şifreniz</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="En az 6 karakter" required>
                </div>
            </div>
            <button type="submit" class="btn btn-custom w-100">Şifreyi Güncelle</button>
        </form>
    </div>
</div>
</body>
</html>
